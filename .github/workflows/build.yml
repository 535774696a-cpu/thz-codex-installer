name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式：test=测试包(staging 地址+TestHook)，production=生产包(https://codex.thz.quest，无 TestHook)"
        required: false
        default: "test"
        type: choice
        options:
          - test
          - production

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 5.1 syntax check
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'exe-src/Runner.ps1',
            'exe-src/InstallerLibrary.ps1',
            'exe-src/build.ps1',
            'tools/stamp-ticket.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $errors = $null
            $tokens = [System.Management.Automation.PSParser]::Tokenize(
              (Get-Content -LiteralPath $file -Raw),
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error "$file`: $($parseError.Message)"
              }
            }
          }
          if ($failed) {
            throw 'PowerShell 5.1 syntax validation failed.'
          }

      - name: PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer
          $results = @()
          foreach ($dir in @('exe-src', 'tools')) {
            $results += Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error
          }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) Error-severity finding(s)."
          }

      - name: Compile
        run: |
          $ErrorActionPreference = 'Stop'
          $eventName = '${{ github.event_name }}'
          if ($eventName -eq 'workflow_dispatch') {
            $mode = '${{ inputs.mode }}'
          } elseif ($eventName -eq 'push') {
            $mode = 'production'
          } else {
            $mode = 'test'
          }
          if ($mode -eq 'production') {
            Write-Host 'Production build: BaseUrl=https://codex.thz.quest, no TestHook'
            .\exe-src\build.ps1 -BaseUrl 'https://codex.thz.quest' -OutDir (Join-Path $PWD 'dist')
          } else {
            Write-Host 'Test build: BaseUrl=http://64.83.26.242:18081, with TestHook'
            .\exe-src\build.ps1 -BaseUrl 'http://64.83.26.242:18081' -TestHook -OutDir (Join-Path $PWD 'dist')
          }

      - name: Ticket stamping smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'dist\THZ-Codex-Setup.exe'
          $copy = Join-Path $env:TEMP 'THZ-Codex-Setup-stamp-smoke.exe'
          Copy-Item -LiteralPath $source -Destination $copy -Force
          $ticket = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789AB'
          & .\tools\stamp-ticket.ps1 -ExePath $copy -Ticket $ticket
          if (-not $?) {
            throw 'stamp-ticket.ps1 failed.'
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            dist/THZ-Codex-Setup.exe
            dist/SHA256SUMS.txt
