name: Installer Regression

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of regression runs (integer from 1 to 50)
        required: true
        default: '20'
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate iterations and create matrix
        id: matrix
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          if [[ ! "$ITERATIONS" =~ ^[0-9]+$ ]] || (( ITERATIONS < 1 || ITERATIONS > 50 )); then
            echo "iterations must be an integer from 1 to 50." >&2
            exit 1
          fi
          matrix="$(jq -cn --argjson count "$ITERATIONS" \
            '{include: [range(1; $count + 1) | {i: .}]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  install:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: powershell
    env:
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          $ErrorActionPreference = 'Stop'
          .\exe-src\build.ps1 -BaseUrl 'http://64.83.26.242:18081' -TestHook -OutDir (Join-Path $PWD 'dist')

      - name: Mint installation token
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STAGING_API_BASE_URL)) {
            throw 'STAGING_API_BASE_URL is empty.'
          }
          $uri = $env:STAGING_API_BASE_URL.TrimEnd('/') + '/api/installer/select-route'
          $response = Invoke-RestMethod `
            -Method Post `
            -Uri $uri `
            -ContentType 'application/json' `
            -Body '{"platform":"windows","network":"openai_ok","mode":"deepseek"}'
          $token = [string]$response.install_token
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'The staging API returned an empty install_token.'
          }
          Write-Host "::add-mask::$token"
          "THZ_INSTALL_TOKEN=$token" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Stamp installation ticket
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\stamp-ticket.ps1 `
            -ExePath .\dist\THZ-Codex-Setup.exe `
            -Ticket $env:THZ_INSTALL_TOKEN
          if (-not $?) {
            throw 'stamp-ticket.ps1 failed.'
          }

      - name: Run installer and assert
        env:
          STAGING_DEEPSEEK_KEY: ${{ secrets.STAGING_DEEPSEEK_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STAGING_DEEPSEEK_KEY)) {
            throw 'STAGING_DEEPSEEK_KEY secret is empty. Create it in Settings > Secrets and variables > Actions before running regression.'
          }
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'installer.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'installer.stderr.log'
          $metadataPath = Join-Path $env:RUNNER_TEMP 'installer-artifact-paths.txt'
          $env:THZ_CI_TEST = '1'
          $env:THZ_DEEPSEEK_KEY = $env:STAGING_DEEPSEEK_KEY

          $process = Start-Process `
            -FilePath (Resolve-Path '.\dist\THZ-Codex-Setup.exe') `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          $stdout = if (Test-Path -LiteralPath $stdoutPath) {
            Get-Content -LiteralPath $stdoutPath -Raw
          } else {
            ''
          }
          $stderr = if (Test-Path -LiteralPath $stderrPath) {
            Get-Content -LiteralPath $stderrPath -Raw
          } else {
            ''
          }
          $combined = $stdout + [Environment]::NewLine + $stderr
          Write-Host $combined

          $workspaceMatch = [regex]::Matches(
            $combined,
            '(?m)^THZ_CI_WORKSPACE=(.+?)\s*$'
          ) | Select-Object -Last 1
          $diagMatch = [regex]::Matches(
            $combined,
            '(?m)^THZ_CI_DIAGLOG=(.+?)\s*$'
          ) | Select-Object -Last 1

          $workspace = if ($workspaceMatch) {
            $workspaceMatch.Groups[1].Value.Trim()
          } else {
            ''
          }
          $diagLog = if ($diagMatch) {
            $diagMatch.Groups[1].Value.Trim()
          } else {
            ''
          }

          @(
            "workspace=$workspace"
            "diaglog=$diagLog"
          ) | Set-Content -LiteralPath $metadataPath -Encoding UTF8

          try {
            if ($process.ExitCode -ne 0) {
              throw "Installer exited with code $($process.ExitCode)."
            }
            if ($combined -notmatch '(?m)^THZ_CI_RESULT=PASS\s*$') {
              throw 'Installer output does not contain THZ_CI_RESULT=PASS.'
            }
            if ([string]::IsNullOrWhiteSpace($workspace)) {
              throw 'THZ_CI_WORKSPACE marker is missing.'
            }
            if (-not (Test-Path -LiteralPath $workspace -PathType Container)) {
              throw "Workspace does not exist: $workspace"
            }

            $transcripts = @(Get-ChildItem `
              -LiteralPath $workspace `
              -Filter 'THZ-Codex-Setup-*.log' `
              -File `
              -Recurse)
            if ($transcripts.Count -eq 0) {
              throw "No THZ-Codex-Setup-*.log transcript exists under $workspace."
            }
            if (-not ($transcripts | Where-Object { $_.Length -gt 0 })) {
              throw 'All installer transcripts are empty.'
            }

            if ([string]::IsNullOrWhiteSpace($diagLog)) {
              throw 'THZ_CI_DIAGLOG marker is missing.'
            }
            if (-not (Test-Path -LiteralPath $diagLog -PathType Leaf)) {
              throw "Diagnostic log does not exist: $diagLog"
            }
            if (-not (Select-String `
              -LiteralPath $diagLog `
              -Pattern 'verification=PASS' `
              -Quiet)) {
              throw 'Diagnostic log does not contain verification=PASS.'
            }

            $machinePath = [Environment]::GetEnvironmentVariable(
              'Path',
              [EnvironmentVariableTarget]::Machine
            )
            $userPath = [Environment]::GetEnvironmentVariable(
              'Path',
              [EnvironmentVariableTarget]::User
            )
            $env:Path = "$machinePath;$userPath"
            & codex --version
            if ($LASTEXITCODE -ne 0) {
              throw "codex --version exited with code $LASTEXITCODE."
            }
          } catch {
            $failure = [regex]::Matches(
              $combined,
              '(?m)^THZ_CI_RESULT=FAIL stage=(\S+) code=(\S+)\s*$'
            ) | Select-Object -Last 1
            if ($failure) {
              Write-Error (
                'Installer failure: stage={0} errorCode={1}' -f `
                  $failure.Groups[1].Value,
                  $failure.Groups[2].Value
              )
            } else {
              Write-Error 'Installer failure marker did not provide stage/errorCode.'
            }
            throw
          }

      - name: Collect diagnostic artifacts
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $artifactRoot = Join-Path $PWD 'ci-artifacts'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          foreach ($name in @('installer.stdout.log', 'installer.stderr.log')) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $artifactRoot -Force
            }
          }

          $metadataPath = Join-Path $env:RUNNER_TEMP 'installer-artifact-paths.txt'
          if (Test-Path -LiteralPath $metadataPath -PathType Leaf) {
            Copy-Item -LiteralPath $metadataPath -Destination $artifactRoot -Force
            $values = @{}
            foreach ($line in Get-Content -LiteralPath $metadataPath) {
              $parts = $line -split '=', 2
              if ($parts.Count -eq 2) {
                $values[$parts[0]] = $parts[1]
              }
            }

            $workspace = $values['workspace']
            if (
              -not [string]::IsNullOrWhiteSpace($workspace) -and
              (Test-Path -LiteralPath $workspace -PathType Container)
            ) {
              Copy-Item `
                -LiteralPath $workspace `
                -Destination (Join-Path $artifactRoot 'workspace') `
                -Recurse `
                -Force
            }

            $diagLog = $values['diaglog']
            if (
              -not [string]::IsNullOrWhiteSpace($diagLog) -and
              (Test-Path -LiteralPath $diagLog -PathType Leaf)
            ) {
              Copy-Item `
                -LiteralPath $diagLog `
                -Destination (Join-Path $artifactRoot 'diagnostic.log') `
                -Force
            }
          }

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ matrix.i }}
          if-no-files-found: warn
          path: ci-artifacts/

  report:
    needs:
      - setup
      - install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write regression summary
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          SETUP_RESULT: ${{ needs.setup.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          {
            echo "## 安装回归汇总"
            echo
            echo "- 总批数：${ITERATIONS}"
            echo "- overall result：${INSTALL_RESULT}"
            echo "- artifact 位置：本次 workflow run 的 **Artifacts** 区域，名称为 \`install-logs-1\` 至 \`install-logs-${ITERATIONS}\`。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SETUP_RESULT" != "success" || "$INSTALL_RESULT" != "success" ]]; then
            exit 1
          fi
