name: Proxy Path Test (GFW simulation)

# 模拟国内网络环境，测试安装器的 hysteria2 代理链路
#
# 背景：GitHub runner 是美国 IP，直连就能下载，根本走不到代理。
# 本 workflow 在跑安装器之前，用 hosts 文件把境外域名指向 127.0.0.1
# （模拟 GFW 封锁），逼安装器走 hysteria2 代理下载。
#
# 封锁的域名：
#   - persistent.oaistatic.com  (ChatGPT 安装包直连下载)
#   - dl.google.com             (Gemini 在线安装器)
#   - chatgpt.com / api.openai.com (安装后网络环境检测)
# 不封锁：
#   - codex.thz.quest (安装器本体、hysteria.exe、proxy-sub、Claude/Gemini 镜像包都从这来)
#
# 运行安装器时设置 THZ_CI_TEST=1，跳过所有阻塞式 GUI 弹窗。

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '测试哪些应用 (逗号分隔: chatgpt,claude,gemini)'
        required: true
        default: 'chatgpt'
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          VALID_APPS="chatgpt claude gemini"
          for app in $(echo "$APPS" | tr ',' ' '); do
            if [[ ! " $VALID_APPS " =~ " $app " ]]; then
              echo "Invalid app: $app" >&2; exit 1
            fi
          done
          matrix="$(echo "$APPS" | tr ',' '\n' | jq -R . | jq -cs '{include: [.[] | {app: .}]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Testing apps: $APPS"

  proxy-test:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Block foreign domains (simulate GFW)
        run: |
          $ErrorActionPreference = 'Stop'
          # 把境外域名指向 127.0.0.1，模拟国内直连被墙
          # 注意：绝不封 codex.thz.quest
          $blocked = @(
            'persistent.oaistatic.com',
            'dl.google.com',
            'chatgpt.com',
            'api.openai.com',
            'auth.openai.com'
          )
          $hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
          $hosts = Get-Content -LiteralPath $hostsPath -Raw -ErrorAction SilentlyContinue
          if ($null -eq $hosts) { $hosts = '' }
          foreach ($domain in $blocked) {
            if ($hosts -notmatch [regex]::Escape($domain)) {
              Add-Content -LiteralPath $hostsPath -Value "127.0.0.1 $domain" -Encoding Ascii
              Write-Host "BLOCKED $domain -> 127.0.0.1"
            } else {
              Write-Host "ALREADY BLOCKED $domain"
            }
          }
          # 刷新 DNS 缓存
          ipconfig /flushdns | Out-Null

      - name: Verify blocking works
        run: |
          $ErrorActionPreference = 'Stop'
          # 确认境外域名已不可达
          foreach ($domain in @('persistent.oaistatic.com', 'dl.google.com')) {
            try {
              $addrs = [Net.Dns]::GetHostAddresses($domain)
              $ips = ($addrs | ForEach-Object { $_.ToString() }) -join ','
              Write-Host "DNS $domain -> $ips"
              if ($ips -notmatch '127\.0\.0\.1') {
                throw "$domain did not resolve to 127.0.0.1 (got: $ips)"
              }
            } catch {
              Write-Host "DNS $domain failed (also acceptable): $($_.Exception.Message)"
            }
          }
          # 确认 codex.thz.quest 未被封（必须可达）
          try {
            $resp = Invoke-WebRequest -Uri 'https://codex.thz.quest/api/installer/download-chatgpt-win' -Method Head -UseBasicParsing -TimeoutSec 30
            Write-Host "codex.thz.quest REACHABLE (HTTP $($resp.StatusCode))"
          } catch {
            # HEAD 可能不被支持，尝试 GET 前几个字节
            Write-Host "HEAD failed, trying GET: $($_.Exception.Message)"
            $resp = Invoke-WebRequest -Uri 'https://codex.thz.quest/api/installer/download-chatgpt-win' -UseBasicParsing -TimeoutSec 30 -OutFile "$env:RUNNER_TEMP\probe.exe"
            $size = (Get-Item "$env:RUNNER_TEMP\probe.exe").Length
            Write-Host "codex.thz.quest REACHABLE (downloaded $size bytes)"
            Remove-Item "$env:RUNNER_TEMP\probe.exe" -Force -ErrorAction SilentlyContinue
          }

      - name: Download installer for ${{ matrix.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          $endpoints = @{
            'chatgpt' = 'https://codex.thz.quest/api/installer/download-chatgpt-win'
            'claude'  = 'https://codex.thz.quest/api/installer/download-claude-setup-win'
            'gemini'  = 'https://codex.thz.quest/api/installer/download-gemini-setup-win'
          }
          $url = $endpoints[$app]
          $outFile = Join-Path $env:RUNNER_TEMP "THZ-Installer-$app.exe"
          Write-Host "Downloading $app installer from $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing -TimeoutSec 120
          $size = (Get-Item -LiteralPath $outFile).Length
          Write-Host "Downloaded $size bytes to $outFile"
          if ($size -lt 10000) { throw "installer too small ($size bytes)" }
          # 必须带 THZ_CI_TEST 的新构建（检查构建时间戳或直接跑）
          echo "INSTALLER_PATH=$outFile" >> $env:GITHUB_ENV

      - name: Run installer with GFW simulation for ${{ matrix.app }}
        run: |
          $ErrorActionPreference = 'Continue'  # 安装器自己报 exit code，我们手动检查
          $app = '${{ matrix.app }}'
          $installer = $env:INSTALLER_PATH
          $logFile = Join-Path $env:RUNNER_TEMP "installer-$app.log"

          # CI 模式：跳过所有阻塞式 GUI 弹窗
          $env:THZ_CI_TEST = '1'

          Write-Host "=== Running installer (THZ_CI_TEST=1, GFW simulated) ==="
          $proc = Start-Process -FilePath $installer -Wait -PassThru `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError "$logFile.err"
          $exitCode = $proc.ExitCode
          Write-Host "Installer exit code: $exitCode"

          Write-Host "=== Installer stdout (last 100 lines) ==="
          if (Test-Path -LiteralPath $logFile) {
            Get-Content -LiteralPath $logFile -Tail 100 | ForEach-Object { Write-Host "  $_" }
          }
          if (Test-Path -LiteralPath "$logFile.err") {
            Write-Host "=== Installer stderr ==="
            Get-Content -LiteralPath "$logFile.err" | ForEach-Object { Write-Host "  ERR: $_" }
          }

          # 保存完整日志供后续步骤分析
          Copy-Item -LiteralPath $logFile -Destination (Join-Path $env:RUNNER_TEMP "full-$app.log") -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $logFile) {
            $diagLine = Get-Content -LiteralPath $logFile | Where-Object { $_ -like 'THZ_CI_DIAGLOG=*' } | Select-Object -Last 1
            if ($diagLine) {
              $diagPath = $diagLine.Substring('THZ_CI_DIAGLOG='.Length).Trim()
              if (Test-Path -LiteralPath $diagPath -PathType Leaf) {
                Copy-Item -LiteralPath $diagPath -Destination (Join-Path $env:RUNNER_TEMP "diagnostic-$app.log") -Force
              }
            }
          }

          if ($exitCode -ne 0) {
            throw "installer failed with exit code $exitCode"
          }

      - name: Verify app installed via proxy path (${{ matrix.app }})
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'

          # 直接验证应用是否装上。原理：直连域名（persistent.oaistatic.com / dl.google.com）
          # 已被 hosts 封死，能装上就证明安装器走了 hysteria2 代理链路——这是最直接的证据。
          # （GUI 安装器在 CI 模式下不写 stdout，查日志标记不可靠，故删掉 proxyMarkers 检查。）

          switch ($app) {
            'chatgpt' {
              Get-AppxPackage | Where-Object { $_.Name -like '*OpenAI*' } | Format-Table Name, PackageFullName, Version -AutoSize
              $pkg = Get-AppxPackage -Name 'OpenAI.Codex' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -eq $pkg) { throw "FAIL: ChatGPT Desktop (OpenAI.Codex) not found after install. persistent.oaistatic.com was blocked, so a successful install proves the proxy path worked -- but the app is missing." }
              Write-Host "INSTALLED: $($pkg.Name) v$($pkg.Version) (proxy path proven: direct download was blocked)"
            }
            'claude' {
              $pkg = Get-AppxPackage | Where-Object { $_.Name -like '*Claude*' } | Select-Object -First 1
              if ($null -eq $pkg) { throw "FAIL: Claude Desktop not found after install" }
              Write-Host "INSTALLED: $($pkg.Name) v$($pkg.Version)"
            }
            'gemini' {
              # Gemini 是传统 exe 安装，检查安装目录或注册表
              Write-Host "Gemini install verification: checking common install locations"
              $found = $false
              $searchRoots = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "$env:ProgramFiles(x86)")
              foreach ($root in $searchRoots) {
                if (Test-Path -LiteralPath $root) {
                  $hit = Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*Gemini*' }
                  if ($hit) { Write-Host "INSTALLED: found at $($hit.FullName)"; $found = $true; break }
                }
              }
              if (-not $found) { throw "FAIL: Gemini install location not found under LOCALAPPDATA/ProgramFiles" }
            }
          }

          Write-Host "PROXY_PATH_TEST app=$app RESULT=PASS"

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-test-fail-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.app }}.log
            ${{ runner.temp }}/diagnostic-${{ matrix.app }}.log
          if-no-files-found: ignore
          retention-days: 7

  proxy-test-macos:
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Block foreign domains (simulate GFW) [mac]
        run: |
          set -euo pipefail
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          127.0.0.1 persistent.oaistatic.com
          127.0.0.1 dl.google.com
          127.0.0.1 chatgpt.com
          127.0.0.1 api.openai.com
          127.0.0.1 auth.openai.com
          EOF
          sudo dscacheutil -flushcache

      - name: Verify blocking works [mac]
        run: |
          set -euo pipefail
          for domain in \
            persistent.oaistatic.com \
            dl.google.com \
            chatgpt.com \
            api.openai.com \
            auth.openai.com; do
            result="$(dscacheutil -q host -a name "$domain")"
            echo "$result"
            if ! grep -Eq '(^|[[:space:]])127\.0\.0\.1($|[[:space:]])' <<<"$result"; then
              echo "$domain did not resolve to 127.0.0.1" >&2
              exit 1
            fi
          done
          # 确认 codex.thz.quest 未被封（必须可达）；加重试，避免偶发 DNS 抖动导致整个 job 误判失败
          probe_ok=false
          for attempt in 1 2 3 4 5; do
            # 用 if 包裹管道，避免 set -e 在探测失败时直接退出（pipefail 下管道返回 curl 的退出码）
            if curl -sSIL --max-time 30 https://codex.thz.quest/api/installer/download-claude-mac | head -5; then
              probe_ok=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "codex.thz.quest 探测第 $attempt 次失败，10 秒后重试" >&2
              sleep 10
            fi
          done
          if [ "$probe_ok" != "true" ]; then
            echo "codex.thz.quest 连续 5 次探测失败" >&2
            exit 1
          fi

      - name: Download DMG for ${{ matrix.app }} [mac]
        run: |
          set -euo pipefail
          app='${{ matrix.app }}'

          case "$app" in
            chatgpt) endpoint='download-chatgpt-mac' ;;
            claude) endpoint='download-claude-mac' ;;
            gemini) endpoint='download-gemini-mac' ;;
            *) echo "Unsupported app: $app" >&2; exit 1 ;;
          esac

          dmg_path="${RUNNER_TEMP}/thz-${app}.dmg"
          http_code=''
          download_succeeded=false

          for attempt in 1 2 3 4 5; do
            rm -f "$dmg_path"
            # --http1.1: 服务器 HTTP/2 大文件传输不稳定（curl 92 stream reset），强制 HTTP/1.1
            # --retry-all-errors: 让 curl 92 这类错误也能被重试（默认 --retry 不覆盖）
            # 外层 bash 循环负责重试与诊断，curl 内部不再重试
            if http_code="$(curl -sSL -m 600 --http1.1 \
              --retry 0 --retry-all-errors \
              -o "$dmg_path" \
              -w "%{http_code}" \
              "https://codex.thz.quest/api/installer/${endpoint}")"; then
              curl_exit=0
            else
              curl_exit=$?
            fi

            if [[ "$curl_exit" -eq 0 && "$http_code" == "200" ]]; then
              download_succeeded=true
              break
            fi

            echo "DMG download attempt ${attempt}/5 failed: curl exit code ${curl_exit}, HTTP ${http_code:-unknown}" >&2
            if [[ "$attempt" -lt 5 ]]; then
              sleep 10
            fi
          done

          if [[ "$download_succeeded" != true ]]; then
            echo "Download failed with HTTP ${http_code:-unknown}" >&2
            exit 1
          fi

          size="$(stat -f '%z' "$dmg_path")"
          if (( size < 1048576 )); then
            echo "DMG too small ($size bytes)" >&2
            exit 1
          fi
          echo "Downloaded $size bytes to $dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Install DMG [mac]
        run: |
          set -euo pipefail
          hdiutil attach "$DMG_PATH" -nobrowse -mountpoint /Volumes/THZTest
          app_path="$(find /Volumes/THZTest -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No app bundle found in DMG" >&2
            hdiutil detach /Volumes/THZTest || true
            exit 1
          fi
          sudo cp -R "$app_path" /Applications/
          hdiutil detach /Volumes/THZTest || { sleep 2; hdiutil detach /Volumes/THZTest || true; }

      - name: Verify app installed [mac]
        run: |
          set -euo pipefail
          app='${{ matrix.app }}'
          case "$app" in
            chatgpt)
              if ! ls -d /Applications/ChatGPT*.app; then
                echo "ChatGPT app not found in /Applications" >&2
                exit 1
              fi
              ;;
            claude)
              if ! ls -d /Applications/Claude*.app; then
                echo "Claude app not found in /Applications" >&2
                exit 1
              fi
              ;;
            gemini)
              if ! ls -d /Applications/Gemini*.app 2>/dev/null && \
                 ! find /Applications -maxdepth 1 -iname '*gemini*' -print -quit | grep -q .; then
                echo "Gemini app not found in /Applications" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported app: $app" >&2
              exit 1
              ;;
          esac
          echo "PROXY_PATH_TEST app=$app platform=macos RESULT=PASS"

      - name: Upload DMG on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-test-macos-fail-${{ matrix.app }}
          path: ${{ runner.temp }}/thz-*.dmg
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs:
      - setup
      - proxy-test
      - proxy-test-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write test summary
        shell: bash
        env:
          APPS: ${{ inputs.apps }}
          WINDOWS_RESULT: ${{ needs.proxy-test.result }}
          MACOS_RESULT: ${{ needs.proxy-test-macos.result }}
        run: |
          {
            echo "## Proxy path test summary (GFW simulation)"
            echo
            echo "- Apps: ${APPS}"
            echo "- Blocked domains: persistent.oaistatic.com, dl.google.com, chatgpt.com, api.openai.com"
            echo "- Windows result: ${WINDOWS_RESULT}"
            echo "- macOS result: ${MACOS_RESULT}"
            echo
            echo "Expected: installer detects direct connection failure and uses hysteria2 for download and installation."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$WINDOWS_RESULT" != "success" || "$MACOS_RESULT" != "success" ]]; then
            echo "Proxy path test failed (windows=${WINDOWS_RESULT}, macos=${MACOS_RESULT})" >&2
            exit 1
          fi
          echo "Proxy path test passed."
