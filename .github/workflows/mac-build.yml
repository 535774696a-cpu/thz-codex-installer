name: macOS installer CI

on:
  push:
    paths:
      - "mac-installer/**"
      - ".github/workflows/mac-build.yml"
  pull_request:
    paths:
      - "mac-installer/**"
      - ".github/workflows/mac-build.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 静态检查 Bash 语法、常见错误和安装器构建所需的固定占位符。
      - name: Run static checks
        shell: bash
        run: |
          set -euo pipefail

          shellcheck --shell=bash --severity=warning mac-installer/install-macos.sh
          bash -n mac-installer/install-macos.sh

          first_line="$(head -n 1 mac-installer/install-macos.sh)"
          test "$first_line" = '#!/bin/bash'

          grep -Fq '__INSTALL_TOKEN__' mac-installer/install-macos.sh
          grep -Fq '__BASE_URL__' mac-installer/install-macos.sh
          grep -Fq '89523844' mac-installer/install-macos.sh
          grep -Fq -- '--ci-key-stdin' mac-installer/install-macos.sh

  test:
    name: Test installer (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
    runs-on: ${{ matrix.os }}
    env:
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STAGING_API_BASE_URL:-}"

      # 测试 A：安装 token 未注入时，安装器应在本地配置校验阶段安全退出。
      - name: Test missing install token
        shell: bash
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/thz-test-no-token"
          mkdir -p "$work_dir"
          cp mac-installer/install-macos.sh "$work_dir/install-macos.sh"

          # 注意：URL 含 /，用 # 作分隔符并用 \Q..\E 转义。
          perl -0pi -e 's#__BASE_URL__#\Q$ENV{STAGING_API_BASE_URL}\E#g' \
            "$work_dir/install-macos.sh"

          marker="$work_dir/log-marker"
          output_file="$work_dir/output.log"
          touch "$marker"

          set +e
          /bin/bash "$work_dir/install-macos.sh" >"$output_file" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "无 token 测试未按预期失败。"
            exit 1
          fi

          if ! grep -Eq '安装包配置不完整|缺少安装授权' "$output_file"; then
            echo "无 token 测试未输出预期提示。"
            exit 1
          fi

          log_dir="${HOME}/Library/Logs"
          if [ ! -d "$log_dir" ] || ! find "$log_dir" -type f \
            -name 'THZ-Codex-Setup-*.log' -newer "$marker" -print -quit | grep -q .; then
            echo "无 token 测试失败后未生成安装日志。"
            exit 1
          fi

      # 测试 B：使用明确无效的 token 请求 /start，验证鉴权失败会返回非零状态。
      - name: Test invalid install token
        shell: bash
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/thz-test-invalid-token"
          mkdir -p "$work_dir"
          cp mac-installer/install-macos.sh "$work_dir/install-macos.sh"

          perl -0pi -e 's#__BASE_URL__#\Q$ENV{STAGING_API_BASE_URL}\E#g; s#__INSTALL_TOKEN__#invalid-token-for-ci-test#g' \
            "$work_dir/install-macos.sh"

          marker="$work_dir/log-marker"
          output_file="$work_dir/output.log"
          touch "$marker"

          set +e
          /bin/bash "$work_dir/install-macos.sh" >"$output_file" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "假 token 测试未按预期失败。"
            exit 1
          fi

          log_dir="${HOME}/Library/Logs"
          if [ ! -d "$log_dir" ] || ! find "$log_dir" -type f \
            -name 'THZ-Codex-Setup-*.log' -newer "$marker" -print -quit | grep -q .; then
            echo "假 token 测试失败后未生成安装日志。"
            exit 1
          fi

      # 测试 C：真 token 配合假 DeepSeek Key，验证后续失败和 /fail 上报链路。
      # 每次运行经匿名通道独立 mint 一个 token，避免并行 matrix job 复用冲突。
      - name: Test failure reporting path
        shell: bash
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/thz-test-failure-report"
          mkdir -p "$work_dir"
          cp mac-installer/install-macos.sh "$work_dir/install-macos.sh"

          token="$(curl -s -m 30 -X POST "${STAGING_API_BASE_URL}/api/installer/select-route" \
            -H 'Content-Type: application/json' \
            -d '{"platform":"macos","network":"openai_ok","mode":"deepseek"}' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["install_token"])')"
          test -n "$token"

          perl -0pi -e 's#__BASE_URL__#\Q$ENV{STAGING_API_BASE_URL}\E#g' \
            "$work_dir/install-macos.sh"
          THZ_TOKEN="$token" perl -0pi -e 's#__INSTALL_TOKEN__#\Q$ENV{THZ_TOKEN}\E#g' \
            "$work_dir/install-macos.sh"

          marker="$work_dir/log-marker"
          output_file="$work_dir/output.log"
          touch "$marker"

          set +e
          printf '%s\n' 'sk-fake-ci-key-0000' |
            /bin/bash "$work_dir/install-macos.sh" --ci-key-stdin >"$output_file" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "假 DeepSeek Key 测试未按预期失败。"
            exit 1
          fi

          log_dir="${HOME}/Library/Logs"
          if [ ! -d "$log_dir" ] || ! find "$log_dir" -type f \
            -name 'THZ-Codex-Setup-*.log' -newer "$marker" -print -quit | grep -q .; then
            echo "失败上报测试未生成安装日志。"
            exit 1
          fi

      # 把本次运行产生的安装日志集中到 runner 临时目录，失败时上传。
      # （upload-artifact 的 path 对 ~ 展开不可靠，改用 runner.temp 下的绝对路径。）
      - name: Collect installer logs
        if: always()
        shell: bash
        run: |
          # runner 为一次性虚拟机，该目录下只有本次运行产生的日志。
          collect_dir="${RUNNER_TEMP}/thz-installer-logs"
          mkdir -p "$collect_dir"
          cp "${HOME}"/Library/Logs/THZ-Codex-Setup-*.log "$collect_dir/" 2>/dev/null || true
          ls -la "$collect_dir" || true

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thz-codex-installer-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/thz-installer-logs
          if-no-files-found: warn
          retention-days: 7
