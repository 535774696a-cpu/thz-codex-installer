name: Desktop Download Test (100x)

# 三个桌面应用的下载链路压力测试
# Windows + Mac，每个应用可配置迭代次数（冒烟 10 / 全量 100）
#
# 注意: GitHub 单个 matrix 最多 256 个 job，因此不直接按"每次迭代"展开，
# 而是按"应用 x 分块"展开（每块 10 次，job 内循环跑）。3 应用 x 100 次 = 30 个 job。

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: '每个应用跑多少遍 (1-100)'
        required: true
        default: '10'
        type: string
      apps:
        description: '测试哪些应用 (逗号分隔: chatgpt,claude,gemini)'
        required: true
        default: 'chatgpt,claude,gemini'
        type: string
      platform:
        description: '测试哪个平台'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - macos

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - name: Validate and build matrix
        id: matrix
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          if [[ ! "$ITERATIONS" =~ ^[0-9]+$ ]] || (( ITERATIONS < 1 || ITERATIONS > 100 )); then
            echo "iterations must be 1-100." >&2
            exit 1
          fi
          # 验证应用列表
          IFS=',' read -ra APP_ARR <<< "$APPS"
          VALID_APPS="chatgpt claude gemini"
          for app in "${APP_ARR[@]}"; do
            app=$(echo "$app" | xargs)  # trim
            if [[ ! " $VALID_APPS " =~ " $app " ]]; then
              echo "Invalid app: $app. Must be one of: $VALID_APPS" >&2
              exit 1
            fi
          done
          # 构建 matrix: 应用 x 分块（每块 PER_CHUNK 次，job 内循环）
          # 保证组合数远低于 GitHub 256 上限
          PER_CHUNK=10
          NUM_CHUNKS=$(( (ITERATIONS + PER_CHUNK - 1) / PER_CHUNK ))
          matrix="$(jq -cn \
            --argjson iters "$ITERATIONS" \
            --argjson per "$PER_CHUNK" \
            --argjson nchunks "$NUM_CHUNKS" \
            --arg apps "$APPS" '
            ($apps | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $app_list |
            {include: [
              $app_list[] as $app |
              range(1; $nchunks + 1) as $c |
              (($c - 1) * $per + 1) as $start |
              ([($c * $per), $iters] | min) as $end |
              {app: $app, chunk: $c, start: $start, end: $end}
            ]}')"
          combos="$(echo "$matrix" | jq '.include | length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $combos (apps x $NUM_CHUNKS chunks, $PER_CHUNK iters/chunk)"
          if (( combos > 256 )); then
            echo "Matrix combos ($combos) exceed GitHub 256 limit!" >&2
            exit 1
          fi

  test-windows:
    needs: setup
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Download and verify ${{ matrix.app }} (chunk ${{ matrix.chunk }}, iters ${{ matrix.start }}-${{ matrix.end }}) [win]"
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          $start = ${{ matrix.start }}
          $end = ${{ matrix.end }}
          $chunk = '${{ matrix.chunk }}'

          # 应用 -> 下载端点映射
          $endpoints = @{
            'chatgpt' = 'https://codex.thz.quest/api/installer/download-chatgpt-win'
            'claude'  = 'https://codex.thz.quest/api/installer/download-claude-setup-win'
            'gemini'  = 'https://codex.thz.quest/api/installer/download-gemini-setup-win'
          }
          $url = $endpoints[$app]
          if (-not $url) { throw "Unknown app: $app" }

          $pass = 0
          $fail = 0
          for ($iter = $start; $iter -le $end; $iter++) {
            $outFile = Join-Path $env:RUNNER_TEMP "thz-$app-$iter.exe"
            try {
              $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
              Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing -TimeoutSec 120
              $stopwatch.Stop()
              $elapsed = [math]::Round($stopwatch.Elapsed.TotalSeconds, 1)

              if (-not (Test-Path -LiteralPath $outFile -PathType Leaf)) {
                throw "file not created"
              }
              $size = (Get-Item -LiteralPath $outFile).Length
              if ($size -lt 10000) {
                throw "file too small ($size bytes)"
              }

              # 验证 PE 头 (MZ)
              $bytes = [System.IO.File]::ReadAllBytes($outFile)[0..1]
              if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw "not a valid PE executable (bad MZ header)"
              }

              $pass++
              Write-Host "PASS app=$app iter=$iter size=$size time=${elapsed}s"
              Remove-Item -LiteralPath $outFile -Force -ErrorAction SilentlyContinue
            } catch {
              $fail++
              Write-Host "FAIL app=$app iter=$iter error=$($_.Exception.Message)"
              # 失败文件保留，供 artifact 上传
            }
          }

          Write-Host "CHUNK_DONE app=$app chunk=$chunk iters=$start-$end pass=$pass fail=$fail"
          if ($fail -gt 0) {
            throw "$fail of $($pass + $fail) downloads failed in chunk $chunk"
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-fail-${{ matrix.app }}-chunk${{ matrix.chunk }}
          path: ${{ runner.temp }}/thz-${{ matrix.app }}-*.exe
          if-no-files-found: ignore
          retention-days: 7

  test-macos:
    needs: setup
    if: ${{ inputs.platform == 'both' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: "Download and verify ${{ matrix.app }} (chunk ${{ matrix.chunk }}, iters ${{ matrix.start }}-${{ matrix.end }}) [mac]"
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ matrix.app }}"
          START="${{ matrix.start }}"
          END="${{ matrix.end }}"
          CHUNK="${{ matrix.chunk }}"

          # 应用 -> 下载端点映射 (Mac)
          # 注意: ChatGPT 暂无 Mac 包，跳过
          case "$APP" in
            chatgpt)
              echo "SKIP app=chatgpt: no Mac package available"
              exit 0
              ;;
            claude)
              URL="https://codex.thz.quest/api/installer/download-claude-mac"
              EXPECT_EXT="dmg"
              ;;
            gemini)
              URL="https://codex.thz.quest/api/installer/download-gemini-mac"
              EXPECT_EXT="dmg"
              ;;
            *)
              echo "Unknown app: $APP" >&2
              exit 1
              ;;
          esac

          pass=0
          fail=0
          for (( i=START; i<=END; i++ )); do
            OUT_FILE="${RUNNER_TEMP}/thz-${APP}-${i}.${EXPECT_EXT}"
            # Claude Mac DMG 约 376MB，runner 下载慢时 180s 不够；加重试应对瞬时 DNS/网络故障
            if ! HTTP_CODE=$(curl -sS -m 600 --retry 3 --retry-delay 10 --retry-all-errors -o "$OUT_FILE" -w "%{http_code}" "$URL"); then
              echo "FAIL app=$APP iter=$i: curl failed"
              fail=$((fail+1))
              continue
            fi
            if [ "$HTTP_CODE" != "200" ]; then
              echo "FAIL app=$APP iter=$i: HTTP $HTTP_CODE"
              fail=$((fail+1))
              rm -f "$OUT_FILE"
              continue
            fi
            if [ ! -f "$OUT_FILE" ]; then
              echo "FAIL app=$APP iter=$i: file not created"
              fail=$((fail+1))
              continue
            fi
            SIZE=$(stat -f%z "$OUT_FILE" 2>/dev/null || stat -c%s "$OUT_FILE")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "FAIL app=$APP iter=$i: file too small ($SIZE bytes)"
              fail=$((fail+1))
              rm -f "$OUT_FILE"
              continue
            fi
            echo "PASS app=$APP iter=$i size=$SIZE"
            pass=$((pass+1))
            rm -f "$OUT_FILE"
          done

          echo "CHUNK_DONE app=$APP chunk=$CHUNK iters=${START}-${END} pass=$pass fail=$fail"
          if [ "$fail" -gt 0 ]; then
            echo "$fail of $((pass + fail)) downloads failed in chunk $CHUNK" >&2
            exit 1
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-fail-${{ matrix.app }}-chunk${{ matrix.chunk }}
          path: ${{ runner.temp }}/thz-${{ matrix.app }}-*.*
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs:
      - setup
      - test-windows
      - test-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write test summary
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          APPS: ${{ inputs.apps }}
          WIN_RESULT: ${{ needs.test-windows.result }}
          MAC_RESULT: ${{ needs.test-macos.result }}
        run: |
          {
            echo "## 桌面应用下载测试汇总"
            echo
            echo "- 应用: ${APPS}"
            echo "- 每应用迭代: ${ITERATIONS} (每 job 跑 10 次)"
            echo "- Windows 结果: ${WIN_RESULT}"
            echo "- Mac 结果: ${MAC_RESULT}"
            echo
            echo "失败的 job 会在 Artifacts 区留下文件 (win-fail-* / mac-fail-*)。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$WIN_RESULT" != "success" && "$WIN_RESULT" != "skipped" ]] || \
             [[ "$MAC_RESULT" != "success" && "$MAC_RESULT" != "skipped" ]]; then
            echo "有测试失败 (win=${WIN_RESULT}, mac=${MAC_RESULT})，详见上方 job 详情。"
            exit 1
          fi
          echo "全部通过。"
